[workspace]
resolver = "3"
license = "MIT"
members = [
    "scarlet-youtube",
    "scarlet-youtube-net",
    "yt",
    "yt-gui",
]

[workspace.dependencies]
scarlet-youtube = { path = "scarlet-youtube" }
scarlet-youtube-net = { path = "scarlet-youtube-net" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "ce807d0f2dfc978c60d7f3b807026455ee101da4", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"] }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "ce807d0f2dfc978c60d7f3b807026455ee101da4", package = "scarlet-ui-macros" }

[patch.crates-io]
ring = { path = "vendor/ring" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
